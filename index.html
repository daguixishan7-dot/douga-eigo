<style>
/* アプリの形: 上に見出し、下に3つの切り替え。動画の画面だけは下に再生の操作。色は「字幕の黄色」を今の文と押した単語の印にだけ使う */

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --fg: #eef0f2; --sub: #9aa1a9; --line: #2a2d31; --mark: #5c4d00; --mark-fg: #fff6c8;
  --btn: #eef0f2; --btn-fg: #000000; --chip: #1c1e21; --ok: #5ccf83; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --fg: #eef0f2; --sub: #9aa1a9; --line: #2a2d31; --mark: #5c4d00; --mark-fg: #fff6c8;

/* 単語帳 */
.wrow { border-bottom: 1px solid var(--line); padding: 12px 0; }

code { font-size: 15px; background: var(--chip); padding: 1px 6px; border-radius: 6px; word-break: break-all; }

/* 話す練習 */

.talk .opts button { min-height: 48px; padding: 0 18px; border-radius: 999px; background: var(--chip); font-size: 15px; font-weight: 700; }
.talk .clock { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 8px 0; }
.talk .ask { font-size: 15px; margin: 0 0 4px; }

.speak .ev { font-size: 15px; margin: 0 0 8px; }

@media (min-width: 900px) {

<script>
// 家の Wi-Fi（このパソコンの serve.py）か GitHub Pages で開いたときは、YouTube をページの中で再生できる。claude.ai ではできない
const LOCAL = /^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
const EMBED = LOCAL || location.hostname.endsWith("github.io");

// 形が変わる動詞など。tools/build.py の IRREG と同じ中身にする
const IRREG = {am:"be",is:"be",are:"be",was:"be",were:"be",been:"be",being:"be",has:"have",had:"have",does:"do",did:"do",done:"do",
  went:"go",gone:"go",made:"make",said:"say",got:"get",gotten:"get",took:"take",taken:"take",came:"come",saw:"see",seen:"see",
  knew:"know",known:"know",thought:"think",told:"tell",found:"find",gave:"give",given:"give",became:"become",began:"begin",begun:"begin",
  brought:"bring",bought:"buy",built:"build",felt:"feel",kept:"keep",left:"leave",lost:"lose",meant:"mean",met:"meet",paid:"pay",
  ran:"run",sent:"send",spent:"spend",stood:"stand",taught:"teach",understood:"understand",won:"win",wrote:"write",written:"write",
  spoke:"speak",spoken:"speak",heard:"hear",held:"hold",led:"lead",fell:"fall",fallen:"fall",grew:"grow",grown:"grow",drew:"draw",
  children:"child",people:"person",men:"man",women:"woman",better:"good",best:"good",worse:"bad",worst:"bad",mice:"mouse",feet:"foot",teeth:"tooth"};
const SUF = [["ies","y"],["ied","y"],["ier","y"],["iest","y"],["es",""],["s",""],["ed",""],["ed","e"],["d",""],["ing",""],["ing","e"],["er",""],["est",""],["ly",""],["ily","y"]];
function candidates(word) {
  let w = word.toLowerCase().replace(/’/g, "'").replace(/'(s|d|ll|re|ve|m)$/, "").replace(/n't$/, "");
  const out = [w];
  if (IRREG[w]) out.push(IRREG[w]);
  for (const [suf, rep] of SUF) {
    if (w.endsWith(suf) && w.length - suf.length >= 2) {
      const stem = w.slice(0, -suf.length) + rep;
      out.push(stem);
      if (rep === "" && stem.length >= 3 && stem.at(-1) === stem.at(-2) && !"aeiou".includes(stem.at(-1))) out.push(stem.slice(0, -1));
    }
  }
  return [...new Set(out)];
}

const S = { videos: [], dict: {}, words: {}, tab: "videos", topic: "すべて", watch: "all", resumed: 0, video: null, jpMode: "always", enMode: "always", rate: 1, repeat: false, cur: -1, review: null };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
// 字幕と動画のずれ（秒、動画ごと）。＋なら字幕を遅らせる。TED のサイトから取った字幕は動画とずれることがあるので、手で合わせられるようにする
const shiftOf = id => +(pref("shift-" + id) || 0);
function pref(k, v) { try { if (v === undefined) return localStorage.getItem("douga-" + k); localStorage.setItem("douga-" + k, v); } catch (e) { return null; } }
S.jpMode = pref("jp") || "always";
S.enMode = pref("en") || "always";
S.watch = pref("watch") || "all";

// ---- 日付（このブラウザの時計で YYYY-MM-DD） ----
const dayStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => dayStr(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return dayStr(d); };
const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;

// ---- 聞いた量（このブラウザに日ごとに残す）。s: 流した秒、w: 聞いた語数（流れた字幕の語数）、sp: 話す練習の回数 ----
let LG = {}; try { LG = JSON.parse(pref("listen") || "{}"); } catch (e) {}
let lgDirty = false, lastTickAt = 0;
const goalMin = () => +(pref("goal") || 30);   // 1日の目標（分）。研究で決まった数ではない。設定で変えられる
function addListen(k, n) { const r = LG[today()] ||= { s: 0, w: 0, sp: 0 }; r[k] = (r[k] || 0) + n; lgDirty = true; }
function saveListen() { if (lgDirty) { pref("listen", JSON.stringify(LG)); lgDirty = false; } }

// ---- 見た記録（このブラウザに動画ごとに残す）。t: 見ていた位置（秒）、b: 流した場所（10秒ごとの番号）、done: 見終わった ----
let P = {}; try { P = JSON.parse(pref("prog") || "{}"); } catch (e) {}
let progDirty = false, progSavedAt = 0;
const BUCKET = 10, MIN_T = 5, DONE_RATIO = 0.9;
const CHECK = `<svg class="check" viewBox="0 0 24 24" role="img" aria-label="見終わった"><path d="M4 12.5l5.5 5.5L20 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function saveProg() { if (progDirty) { pref("prog", JSON.stringify(P)); progDirty = false; } saveListen(); progSavedAt = Date.now(); }
// 話の終わり＝最後の字幕の終わり。動画の長さは出どころ（TED の配信と YouTube）で10〜30秒ちがうので使わない
const endOf = v => v.lines.at(-1)?.e || v.dur;
// 最後の文が始まったら終わりまで来たとみなす（最後の字幕の終わりは推定で、動画より数秒長いことがある）
const lastAt = v => v.lines.at(-1)?.s ?? v.dur;
function watchState(v) { const r = P[v.id]; return r?.done ? "done" : r?.t >= MIN_T ? "part" : "none"; }
function resumeAt(v) { const r = P[v.id]; return r && !r.done && r.t >= MIN_T && r.t < lastAt(v) ? Math.max(0, r.t - 2) : 0; }
function noteProgress(v, raw, t) {
  const r = P[v.id] ||= { t: 0, b: [] };
  if (r.done) return;
  const k = Math.floor(raw / BUCKET);
  if (!r.b.includes(k)) r.b.push(k);
  if (Math.abs(r.t - raw) >= 1) { r.t = Math.round(raw); progDirty = true; }
  // 終わりへ飛ばしただけでは印を付けないよう、話の9割以上を流したときだけ見終わりにする
  const need = (endOf(v) - (v.lines[0]?.s || 0)) / BUCKET * DONE_RATIO;
  if (t >= lastAt(v) && r.b.length >= need) { P[v.id] = { done: 1 }; progDirty = true; saveProg(); renderWatch(); return; }
  if (Date.now() - progSavedAt > 5000) saveProg();
}
function setDone(v, on) {
  if (on) P[v.id] = { done: 1 }; else delete P[v.id];
  progDirty = true; saveProg(); S.resumed = 0; renderWatch();
}
function renderWatch() {
  const el = $("#watch"), v = S.video; if (!el || !v) return;
  el.innerHTML = watchState(v) === "done"
    ? `<span class="fin">${CHECK}見終わった</span><button data-mark="0">印を外す</button>`
    : `${S.resumed ? `<span>${mmss(S.resumed)} から続けます</span><button data-restart>最初から</button>` : ""}<button data-mark="1">見終わった印を付ける</button>`;
}
addEventListener("pagehide", saveProg);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveProg(); });

// ---- 単語帳の置き場所: claude.ai では db、家の Wi-Fi では serve.py、どちらも無ければこのブラウザ ----
const Store = {
  kind: "browser", db: null,
  async init() {
    if (LOCAL) {
      try { const r = await fetch("api/words"); if (r.ok) { this.kind = "local"; S.words = await r.json(); return; } } catch (e) {}
    }
    try { S.words = JSON.parse(pref("words") || "{}"); } catch (e) { S.words = {}; }
    if (window.claude?.use) {
      const db = await window.claude.use("db").catch(() => null);
      if (db) {
        this.kind = "db"; this.db = db;
        db.collection("words").onSnapshot(snap => {
          S.words = {}; snap.docs.forEach(d => { S.words[d.id] = d.data(); });
          if (!S.video && (S.tab === "words" || (S.tab === "videos" && dueIds().length !== S.dueShown))) render();
        }, () => {});
      }
      // claude.ai 版だけ: Claude に見てもらう（sample）・質問を読み上げる（tts）・話した言葉を文字にする（dictation）
      window.claude.use("sample").then(s => { S.sample = s; if (T.phase === "done") renderTalk(); }).catch(() => {});
      window.claude.use("tts").then(x => { S.tts = x; }).catch(() => {});
      window.claude.use("dictation").then(d => {
        if (!d) return;
        STT.dict = d;
        d.onPartial(({ text }) => { if (T.phase === "talk") { T.interim = text; showLive(); } });
        d.onFinal(({ text }) => { if (T.phase === "talk" || T.phase === "done") { T.text = (T.text + " " + text).trim(); T.interim = ""; showLive(); } });
        if (!T.phase && $("#talk")) renderTalk();
      }).catch(() => {});
    }
  },
  async put(id, doc) {
    S.words[id] = doc;
    try {
      if (this.kind === "db") await this.db.collection("words").doc(id).set(doc);
      else if (this.kind === "local") await fetch("api/words/" + encodeURIComponent(id), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(doc) });
      else pref("words", JSON.stringify(S.words));
    } catch (e) { console.warn("単語帳に書けませんでした", e); }
  },
  async del(id) {
    delete S.words[id];
    try {
      if (this.kind === "db") await this.db.collection("words").doc(id).delete();
      else if (this.kind === "local") await fetch("api/words/" + encodeURIComponent(id), { method: "DELETE" });
      else pref("words", JSON.stringify(S.words));
    } catch (e) {}
  },
};

// ---- 聞いた量の帯（一覧の上）。動画を流した時間だけ数える（claude.ai 版はページの中で流せないので出さない） ----
const fmtN = n => n >= 10000 ? `${(n / 10000).toFixed(1)}万` : Math.round(n).toLocaleString();
const hm = sec => { const m = Math.round(sec / 60); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60}分` : `${m}分`; };
function meterHTML() {
  const due = S.dueShown = dueIds().length;
  const dueRow = due ? `<div class="due"><span>今日の単語の復習 <b>${due}語</b></span><button class="textbtn" data-tab-go="words">復習する</button></div>` : "";
  if (!EMBED) return due ? `<div class="meter">${dueRow}</div>` : "";
  const days = [...Array(7)].map((_, k) => addDays(k - 6)), goal = goalMin();
  const mins = days.map(d => (LG[d]?.s || 0) / 60), week = mins.reduce((a, m) => a + m, 0);
  const all = Object.values(LG), totS = all.reduce((a, r) => a + (r.s || 0), 0), totW = all.reduce((a, r) => a + (r.w || 0), 0);
  const W = 340, H = 90, top = 6, base = 68, bw = 32, gap = (W - 7 * bw) / 6, max = Math.max(goal * 1.25, ...mins);
  const y = m => base - (base - top) * Math.min(m, max) / max;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="この7日に聞いた分数。点線は1日の目標${goal}分">`;
  days.forEach((d, k) => {
    const x = k * (bw + gap);
    s += `<rect class="tr" x="${x}" y="${top}" width="${bw}" height="${base - top}" rx="4"/>`;
    if (mins[k] >= 0.5) s += `<rect class="bar${mins[k] >= goal ? " ok" : ""}" x="${x}" y="${y(mins[k])}" width="${bw}" height="${base - y(mins[k])}" rx="4"/>`;
    s += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${k === 6 ? "今日" : "日月火水木金土"[new Date(d + "T00:00").getDay()]}</text>`;
  });
  s += `<line class="goal" x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}"/></svg>`;
  return `<div class="meter"><p>今日 <b>${Math.round(mins[6])}分</b> 聞いた（目標 ${goal}分）・この7日 ${Math.round(week)}分</p>${s}
    <p class="small">これまで ${hm(totS)}・字幕でおよそ${fmtN(totW)}語を聞きました（このブラウザの記録）。</p>${dueRow}</div>`;
}

// ---- 単語の板 ----
function lookup(word) {
  for (const c of candidates(word)) if (S.dict[c]) return { head: c, mean: S.dict[c] };
  return null;
}
function senses(mean) {
  // 「answer」「ampere」のような略語の言いかえ（日本語を含まない意味）は後ろへ回す
  // 長い見出し（take など）は「・」でも意味を区切っている
  // （〈魚・獲物〉のように、かっこの中の「・」では区切らない）
  const parts = []; let cur = "", depth = 0;
  for (const ch of mean.replace(/『|』/g, "").replace(/ \/ /g, "\u0001")) {
    if ("〈(（《[".includes(ch)) depth++;
    if ("〉)）》]".includes(ch)) depth = Math.max(0, depth - 1);
    if (ch === "\u0001" || (ch === "・" && depth === 0)) { parts.push(cur); cur = ""; } else cur += ch;
  }
  const all = [...parts, cur].map(s => s.trim()).filter(Boolean);
  const jp = s => /[぀-ヿ一-鿿]/.test(s);
  return [...all.filter(jp), ...all.filter(s => !jp(s))];
}
// ---- 発音（ブラウザに入っている読み上げを使う。無料。声はスマホやパソコンによってちがう） ----
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function say(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = 0.9;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /^en[-_]US/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
// ---- 熟語と例文 ----
const WRE = /[A-Za-z]+(?:['’][A-Za-z]+)*/g;
function hasPhrase(en, phrase) {
  const toks = [...en.matchAll(WRE)].map(m => candidates(m[0])), w = phrase.split(" ");
  return toks.some((_, i) => w.every((x, k) => toks[i + k]?.includes(x)));
}
let EX = null;
function exIndex() {
  // 見出し語 → その言葉が出てくる [動画の番号, 文の番号]。初めて使うときに一度だけ作る
  if (EX) return EX;
  EX = new Map(); const memo = new Map();
  S.videos.forEach((v, vi) => v.lines.forEach((l, li) => {
    const seen = new Set();
    for (const m of l.en.matchAll(WRE)) {
      const k = m[0].toLowerCase();
      if (!memo.has(k)) memo.set(k, lookup(k)?.head || null);
      const h = memo.get(k); if (!h || seen.has(h)) continue;
      seen.add(h); if (!EX.has(h)) EX.set(h, []); EX.get(h).push([vi, li]);
    }
  }));
  return EX;
}
function examples(head, cur) {
  // ほかの文から3つ。訳があって、長すぎず短すぎない文。できるだけ別々の動画から
  const all = (exIndex().get(head) || []).map(([vi, li]) => ({ v: S.videos[vi], l: S.videos[vi].lines[li] }))
    .filter(x => x.l !== cur && x.l.ja && x.l.en.length >= 25 && x.l.en.length <= 140)
    .sort((a, b) => Math.abs(a.l.en.length - 70) - Math.abs(b.l.en.length - 70));
  const out = [], vids = new Set();
  for (const x of all) { if (!vids.has(x.v.id)) { out.push(x); vids.add(x.v.id); } if (out.length === 3) break; }
  return out;
}
function boldWord(en, head) {
  return esc(en).replace(WRE, m => candidates(m).includes(head) ? `<b>${m}</b>` : m);
}

    const doc = () => ({ head: r.head, mean: all.slice(0, 3).join(" / "), en: line.en, ja: line.ja || "", vid: S.video.id, t: line.s,
      n: (S.words[id]?.n || 0) + 1, done: false, box: 0, due: addDays(1), at: new Date().toISOString(), first: S.words[id]?.first || new Date().toISOString() });

// ---- 復習（日をあけて思い出す）。思い出せたら次は 3→7→14→30→60日後、だめなら明日。60日後にも思い出せたら「覚えた」 ----
const GAPS = [1, 3, 7, 14, 30, 60];
const dueOf = w => w.due || today();   // 復習の日がない（前からある）単語は、今日が復習の日
function dueIds() {
  const t = today();
  return Object.entries(S.words).filter(([, w]) => !w.done && dueOf(w) <= t).sort((a, b) => dueOf(a[1]).localeCompare(dueOf(b[1]))).map(([id]) => id);
}
function nextDue() {
  const t = today(), fut = Object.values(S.words).filter(w => !w.done && dueOf(w) > t).map(dueOf).sort();
  return fut.length ? { day: fut[0], n: fut.filter(d => d === fut[0]).length } : null;
}
function grade(id, ok) {
  const w = S.words[id]; if (!w) return;
  const box = ok ? (w.box || 0) + 1 : 0;
  const doc = { ...w, box, due: addDays(ok ? GAPS[Math.min(box, GAPS.length - 1)] : 1), ok: (w.ok || 0) + (ok ? 1 : 0), ng: (w.ng || 0) + (ok ? 0 : 1) };
  if (ok && box >= GAPS.length) doc.done = true;
  Store.put(id, doc);
}
function renderReview(main) {
  const R = S.review, id = R.q[R.i], w = id && S.words[id];

      <p class="note">${R.base}語を復習して、${R.ok}語を思い出せました。${nx ? `次の復習は ${md(nx.day)} に ${nx.n}語です。` : ""}</p>

    : `<a class="textbtn" href="https://www.youtube.com/watch?v=${esc(w.vid)}&t=${Math.floor(w.t)}s" target="_blank" rel="noopener">この場面を見る</a>`;
  main.innerHTML = `<div class="pad wrap card">
    <div class="rhead"><span class="note">${Math.min(R.i + 1, R.base)} / ${R.base}${R.i >= R.base ? "（もう一度）" : ""}</span><button class="textbtn" data-revend>やめる</button></div>
    <p class="ctxen">${boldWord(w.en, w.head)} <button class="say sm" data-say="${esc(w.en)}" aria-label="文を聞く">${SPK}</button></p>

    ${R.show ? `<div class="ans"><p>${esc(w.mean)}</p><p class="note">${esc(w.ja)}</p>${scene}</div>
      <div class="grade"><button class="secondary" data-grade="0">だめだった</button><button class="primary" data-grade="1">思い出せた</button></div>`
    : `<p class="note">文の中での意味を、見る前に思い出してください。</p><div class="grade"><button class="primary" data-reveal>意味を見る</button></div>`}
  </div>`;
}

// 合言葉はリンクの # のあと（#k=合言葉）か、設定で入れる。# のあとはサーバーに送られない
async function unlock(given) {
  const m = location.hash.match(/k=([\w-]+)/);
  if (m) { pref("key", m[1]); history.replaceState(null, "", location.pathname + location.search); }
  const pass = given || pref("key");
  let buf;
  try { const r = await fetch("data/private.bin"); if (!r.ok) return false; buf = new Uint8Array(await r.arrayBuffer()); } catch (e) { return false; }
  S.locked = true;
  if (!pass || S.privateN) return false;
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: buf.slice(0, 16), iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const zip = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(16, 28) }, key, buf.slice(28));
    const text = await new Response(new Blob([zip]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    const more = JSON.parse(text);
    S.videos = [...S.videos, ...more].sort((a, b) => a.wpm * Math.sqrt(a.dur) - b.wpm * Math.sqrt(b.dur));
    S.privateN = more.length; EX = null;
    pref("key", pass);
    return true;
  } catch (e) { return false; }  // 合言葉がちがう
}

(async () => {
  try {
    const [v, d] = await Promise.all([fetch("data/videos.json").then(r => r.json()), fetch("data/dict.json").then(r => r.json())]);
    S.videos = v; S.dict = d;
    await unlock();
  } catch (e) {
    $("#main").innerHTML = `<div class="pad"><p class="note">字幕のデータを読めませんでした。ページを開き直してください。</p></div>`;
    return;
  }
  render();
  await Store.init();
  if (S.tab !== "videos" || S.video || dueIds().length !== S.dueShown) render();
})();
